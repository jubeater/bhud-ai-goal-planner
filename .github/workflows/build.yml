name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build AiGoalPlanner.sln -c Release --nologo

      - name: Test
        run: dotnet test AiGoalPlanner.sln -c Release --no-build --nologo

      - name: Keep the .bhm
        uses: actions/upload-artifact@v5
        with:
          name: AiGoalPlanner-bhm
          path: src/AiGoalPlanner/bin/Release/net48/AiGoalPlanner.bhm
          if-no-files-found: error

      - name: Publish the release for a v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/AiGoalPlanner/bin/Release/net48/AiGoalPlanner.bhm
          generate_release_notes: true
