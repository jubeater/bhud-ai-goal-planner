name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build AiGoalPlanner.sln -c Release --nologo

      - name: Test
        run: dotnet test AiGoalPlanner.sln -c Release --no-build --nologo

      - name: Check against Blish HUD's System.Text.Json 5.0
        run: |
          dotnet build tests/AiGoalPlanner.Stj5Check/AiGoalPlanner.Stj5Check.csproj -c Release --nologo
          tests\AiGoalPlanner.Stj5Check\bin\Release\net48\AiGoalPlanner.Stj5Check.exe

      - name: Release build holds no developer channel
        shell: pwsh
        run: |
          $asm = [System.Reflection.Assembly]::LoadFrom((Join-Path $PWD 'src/AiGoalPlanner/bin/Release/net48/AiGoalPlanner.dll'))
          try { $types = $asm.GetTypes() }
          catch [System.Reflection.ReflectionTypeLoadException] { $types = $_.Exception.Types | Where-Object { $_ -ne $null } }
          $leaked = @($types | Where-Object { $_.FullName -match 'Dev(Channel|Request|Response|Inbox|Gate|Lookup|RoundTrip)|LookupOutcome' } | ForEach-Object { $_.FullName })
          if ($leaked.Count -gt 0) { Write-Error "Release DLL contains developer channel types: $($leaked -join ', ')"; exit 1 }
          Write-Output 'Release DLL holds no developer channel.'

      - name: Keep the .bhm
        uses: actions/upload-artifact@v7
        with:
          name: AiGoalPlanner-bhm
          path: src/AiGoalPlanner/bin/Release/net48/AiGoalPlanner.bhm
          if-no-files-found: error

      - name: Publish the release for a v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src/AiGoalPlanner/bin/Release/net48/AiGoalPlanner.bhm
          generate_release_notes: true
